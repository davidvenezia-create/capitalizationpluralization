<!DOCTYPE html>
<html lang="en" data-size="normal" data-motion="full">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Workshop — Capital Letters &amp; Plurals</title>
<meta name="description" content="Practice capitalization and pluralization rules, then write your own rules to remember them." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F2F6F1;
    --surface: #FFFFFF;
    --surface-dim: #EAF0E8;
    --border: #D7E2D4;
    --ink: #1E2B27;
    --ink-soft: #52655D;
    --brand: #2F6F4E;
    --brand-dark: #1F4E36;
    --brand-tint: #E3EFE6;
    --gold: #C98A18;
    --gold-tint: #FBEFD4;
    --gold-border: #E3B457;
    --rust: #A84B34;
    --rust-tint: #F6E4DE;
    --focus: #1B5AA8;
    --radius-card: 20px;
    --radius-pill: 999px;
    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 24px;
    --sp-6: 32px;
    --sp-7: 48px;
    --shadow-card: 0 2px 10px rgba(30,43,39,0.07);
  }

  html[data-size="large"]{ font-size: 112.5%; }
  html[data-size="xlarge"]{ font-size: 128%; }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Atkinson Hyperlegible', Arial, sans-serif;
    font-size: 1.125rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3{
    font-family: 'Fredoka', 'Atkinson Hyperlegible', sans-serif;
    font-weight: 600;
    line-height: 1.25;
    margin: 0 0 var(--sp-3) 0;
    color: var(--brand-dark);
  }

  h1{ font-size: 1.5rem; }
  h2{ font-size: 1.35rem; }
  h3{ font-size: 1.1rem; }

  p{ margin: 0 0 var(--sp-4) 0; max-width: 62ch; }

  button, input, textarea{
    font-family: inherit;
    font-size: 1rem;
    color: inherit;
  }

  :focus-visible{
    outline: 3px solid var(--focus);
    outline-offset: 3px;
    border-radius: 6px;
  }

  [data-motion="reduced"] *{
    transition: none !important;
    animation: none !important;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }

  /* ---------- layout shell ---------- */

  #app{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header.site-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-4);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .brand-mark{
    display: flex;
    align-items: baseline;
    gap: var(--sp-2);
  }
  .brand-mark .glyph{
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    color: var(--brand);
  }
  .brand-mark .glyph b{ color: var(--gold); }
  .brand-mark small{
    color: var(--ink-soft);
    font-size: 0.85rem;
  }

  .a11y-toolbar{
    display: flex;
    gap: var(--sp-2);
    flex-wrap: wrap;
  }

  .chip-btn{
    background: var(--surface);
    border: 2px solid var(--border);
    color: var(--ink-soft);
    border-radius: var(--radius-pill);
    padding: 6px 14px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .chip-btn:hover{ border-color: var(--brand); color: var(--brand-dark); }
  .chip-btn[aria-pressed="true"]{
    background: var(--brand-tint);
    border-color: var(--brand);
    color: var(--brand-dark);
    font-weight: 700;
  }

  main{
    flex: 1;
    display: flex;
    justify-content: center;
    padding: var(--sp-6) var(--sp-4) var(--sp-7);
  }

  .screen{
    width: 100%;
    max-width: 640px;
  }

  footer.site-foot{
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.85rem;
    padding: var(--sp-4);
  }

  /* ---------- home ---------- */

  .home-intro{ margin-bottom: var(--sp-5); }

  .task-list{
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
  }

  .task-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: var(--sp-5);
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
    text-align: left;
  }

  .task-card .status{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink-soft);
    width: fit-content;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    background: var(--surface-dim);
  }
  .task-card .status.done{ color: var(--brand-dark); background: var(--brand-tint); }
  .task-card .status.doing{ color: #7A5A0E; background: var(--gold-tint); }

  .reset-line{
    margin-top: var(--sp-6);
    text-align: center;
  }
  .link-btn{
    background: none;
    border: none;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    font-size: 0.9rem;
    padding: var(--sp-2);
  }
  .link-btn:hover{ color: var(--rust); }

  /* ---------- buttons ---------- */

  .btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: var(--radius-pill);
    padding: 13px 26px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    border: 2px solid transparent;
    line-height: 1.2;
  }
  .btn-primary{
    background: var(--brand);
    color: #fff;
  }
  .btn-primary:hover{ background: var(--brand-dark); }
  .btn-primary:disabled{
    background: var(--surface-dim);
    color: var(--ink-soft);
    cursor: not-allowed;
  }
  .btn-ghost{
    background: transparent;
    border-color: var(--border);
    color: var(--brand-dark);
  }
  .btn-ghost:hover{ border-color: var(--brand); }

  .btn-row{
    display: flex;
    gap: var(--sp-3);
    flex-wrap: wrap;
    margin-top: var(--sp-4);
  }

  /* ---------- practice card shell ---------- */

  .practice-top{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--sp-4);
    gap: var(--sp-3);
    flex-wrap: wrap;
  }

  .progress-track{
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .progress-dot{
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--surface-dim);
    border: 2px solid var(--border);
  }
  .progress-dot.current{ background: var(--gold); border-color: var(--gold-border); }
  .progress-dot.filled{ background: var(--brand); border-color: var(--brand); }

  .q-count{ font-size: 0.9rem; color: var(--ink-soft); font-weight: 700; }

  .stars{
    font-size: 0.9rem;
    color: var(--gold);
    font-weight: 700;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: var(--sp-5);
    box-shadow: var(--shadow-card);
  }

  .instruction{
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--brand-dark);
    margin-bottom: var(--sp-4);
  }

  .rule-tag{
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--surface-dim);
    border-radius: var(--radius-pill);
    padding: 3px 12px;
    margin-bottom: var(--sp-3);
  }

  /* ---------- word tokens (capitalization) ---------- */

  .word-row{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: var(--sp-4) 0 var(--sp-5);
    padding: var(--sp-4);
    background: var(--bg);
    border-radius: 14px;
  }

  .word-token{
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
  }
  .word-token:hover{ border-color: var(--brand); }
  .word-token.is-capped{
    background: var(--gold-tint);
    border-color: var(--gold-border);
    color: #6B4A0B;
  }
  .word-token.mark-correct{
    border-color: var(--brand);
    background: var(--brand-tint);
    color: var(--brand-dark);
  }
  .word-token.mark-wrong{
    border-color: var(--rust);
    background: var(--rust-tint);
    color: var(--rust);
    border-style: dashed;
  }

  .feedback-box{
    border-radius: 14px;
    padding: var(--sp-4);
    margin-top: var(--sp-4);
  }
  .feedback-box.good{ background: var(--brand-tint); color: var(--brand-dark); }
  .feedback-box.retry{ background: var(--gold-tint); color: #6B4A0B; }
  .feedback-box .rule-line{
    margin-top: var(--sp-2);
    font-weight: 400;
    color: var(--ink);
  }

  /* ---------- plural input ---------- */

  .plural-word{
    font-family: 'Fredoka', sans-serif;
    font-size: 2rem;
    font-weight: 600;
    color: var(--brand-dark);
    margin: var(--sp-3) 0 var(--sp-5);
  }

  .plural-form{
    display: flex;
    gap: var(--sp-3);
    flex-wrap: wrap;
    align-items: center;
  }

  .text-input{
    flex: 1;
    min-width: 180px;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 1.15rem;
  }
  .text-input:focus{ border-color: var(--brand); }
  .text-input.mark-correct{ border-color: var(--brand); background: var(--brand-tint); }
  .text-input.mark-wrong{ border-color: var(--rust); background: var(--rust-tint); }

  .hint-line{
    margin-top: var(--sp-3);
    color: var(--ink-soft);
    font-style: normal;
  }

  /* ---------- break screen ---------- */

  .break-card{
    text-align: center;
    padding: var(--sp-7) var(--sp-5);
  }
  .break-card .big-glyph{
    font-size: 2.4rem;
    margin-bottom: var(--sp-3);
  }

  /* ---------- done screen ---------- */

  .done-card{ text-align: center; }
  .done-stars{
    font-size: 1.6rem;
    color: var(--gold);
    margin: var(--sp-3) 0 var(--sp-5);
  }

  /* ---------- reflection ---------- */

  .reflect-block{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: var(--sp-5);
    box-shadow: var(--shadow-card);
    margin-bottom: var(--sp-5);
  }

  .starter-row{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: var(--sp-3);
  }

  .starter-chip{
    background: var(--brand-tint);
    border: 1px solid var(--brand);
    color: var(--brand-dark);
    border-radius: var(--radius-pill);
    padding: 6px 14px;
    font-size: 0.9rem;
    cursor: pointer;
    text-align: left;
  }
  .starter-chip:hover{ background: #d3e6d9; }

  textarea.rule-input{
    width: 100%;
    min-height: 120px;
    padding: var(--sp-3);
    border: 2px solid var(--border);
    border-radius: 12px;
    resize: vertical;
    line-height: 1.5;
  }
  textarea.rule-input:focus{ border-color: var(--brand); }

  .save-note{
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-top: var(--sp-2);
  }

  #print-view{ display: none; }

  @media print{
    header.site-head, footer.site-foot, .no-print{ display: none !important; }
    main{ padding: 0; }
    #print-view{
      display: block;
      font-family: 'Atkinson Hyperlegible', Arial, sans-serif;
    }
    #print-view h2{ margin-top: 28px; }
    #print-view .printed-rule{
      white-space: pre-wrap;
      border: 1px solid #999;
      border-radius: 10px;
      padding: 14px;
    }
  }

  @media (max-width: 480px){
    .plural-word{ font-size: 1.6rem; }
    .word-token{ font-size: 1rem; padding: 8px 12px; }
  }
</style>
</head>
<body>
<div id="app">

  <header class="site-head no-print">
    <div class="brand-mark">
      <span class="glyph">Word <b>W</b>orkshop</span>
      <small>Capital letters &amp; plurals</small>
    </div>
    <div class="a11y-toolbar">
      <button class="chip-btn" id="btn-home-icon" type="button">Home</button>
      <button class="chip-btn" id="btn-text-size" type="button">Text size: Normal</button>
      <button class="chip-btn" id="btn-motion" type="button" aria-pressed="false">Reduce motion</button>
    </div>
  </header>

  <main>
    <div class="screen" id="screen" role="region" aria-live="polite"></div>
  </main>

  <div id="print-view"></div>

  <footer class="site-foot no-print">
    Word Workshop — practice capital letters and plurals, then write the rules that help you remember them.
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ============ CONTENT ============ */

  var capQuestions = [
    {
      words: [
        {base:"my", cap:true, suf:""},
        {base:"brother", cap:false, suf:""},
        {base:"plays", cap:false, suf:""},
        {base:"soccer", cap:false, suf:""},
        {base:"every", cap:false, suf:""},
        {base:"day", cap:false, suf:"."}
      ],
      rule: "Capitalize the first word of every sentence."
    },
    {
      words: [
        {base:"i", cap:true, suf:""},
        {base:"live", cap:false, suf:""},
        {base:"in", cap:false, suf:""},
        {base:"new", cap:true, suf:""},
        {base:"jersey", cap:true, suf:"."}
      ],
      rule: "The word \"I\" is always capitalized, and so are the names of specific places."
    },
    {
      words: [
        {base:"we", cap:true, suf:""},
        {base:"saw", cap:false, suf:""},
        {base:"mr", cap:true, suf:"."},
        {base:"rivera", cap:true, suf:""},
        {base:"at", cap:false, suf:""},
        {base:"the", cap:false, suf:""},
        {base:"store", cap:false, suf:"."}
      ],
      rule: "Capitalize the first word of a sentence, and capitalize a title like \"Mr.\" when it's used with a name."
    },
    {
      words: [
        {base:"school", cap:true, suf:""},
        {base:"starts", cap:false, suf:""},
        {base:"again", cap:false, suf:""},
        {base:"in", cap:false, suf:""},
        {base:"september", cap:true, suf:"."}
      ],
      rule: "Capitalize the first word of a sentence and the names of months."
    },
    {
      words: [
        {base:"carlos", cap:true, suf:""},
        {base:"speaks", cap:false, suf:""},
        {base:"spanish", cap:true, suf:""},
        {base:"and", cap:false, suf:""},
        {base:"english", cap:true, suf:"."}
      ],
      rule: "Capitalize people's names and the names of languages."
    },
    {
      words: [
        {base:"next", cap:true, suf:""},
        {base:"friday", cap:true, suf:""},
        {base:"is", cap:false, suf:""},
        {base:"my", cap:false, suf:""},
        {base:"birthday", cap:false, suf:"."}
      ],
      rule: "Capitalize the first word of a sentence and the days of the week."
    },
    {
      words: [
        {base:"my", cap:true, suf:""},
        {base:"favorite", cap:false, suf:""},
        {base:"book", cap:false, suf:""},
        {base:"is", cap:false, suf:""},
        {base:"charlotte's", cap:true, suf:""},
        {base:"web", cap:true, suf:"."}
      ],
      rule: "Capitalize the first word of a sentence and the important words in a title."
    },
    {
      words: [
        {base:"aunt", cap:true, suf:""},
        {base:"rosa", cap:true, suf:""},
        {base:"moved", cap:false, suf:""},
        {base:"to", cap:false, suf:""},
        {base:"puerto", cap:true, suf:""},
        {base:"rico", cap:true, suf:""},
        {base:"in", cap:false, suf:""},
        {base:"july", cap:true, suf:"."}
      ],
      rule: "Capitalize a title used with a name, people's names, place names, and the names of months."
    }
  ];

  var pluralQuestions = [
    { word:"cat", answer:"cats", rule:"Add -s to most nouns to make them plural.", hint:"Just add the letter s." },
    { word:"box", answer:"boxes", rule:"Add -es to words that end in s, x, z, ch, or sh.", hint:"Box ends in x, so add -es." },
    { word:"baby", answer:"babies", rule:"When a word ends in a consonant + y, change the y to i and add -es.", hint:"Baby ends in consonant + y." },
    { word:"boy", answer:"boys", rule:"When a word ends in a vowel + y, just add -s.", hint:"Boy ends in vowel + y (o + y)." },
    { word:"leaf", answer:"leaves", rule:"Some words that end in f or fe change to -ves in the plural.", hint:"Change the f to v, then add -es." },
    { word:"child", answer:"children", rule:"Some plurals are irregular — they don't follow a pattern, so we memorize them.", hint:"This one is irregular." },
    { word:"mouse", answer:"mice", rule:"Some plurals are irregular — they don't follow a pattern, so we memorize them.", hint:"Think of the small animal — it's irregular." },
    { word:"sheep", answer:"sheep", rule:"Some words stay exactly the same in the plural form.", hint:"This word doesn't change at all." },
    { word:"potato", answer:"potatoes", rule:"Many words that end in a consonant + o add -es.", hint:"Potato ends in consonant + o." },
    { word:"photo", answer:"photos", rule:"Some words that end in o just add -s.", hint:"Photo just needs an -s." }
  ];

  var CAP_CHUNK = 4;
  var PLURAL_CHUNK = 5;

  /* ============ STATE ============ */

  var S = {
    screen: "home",
    cap: { index:0, stars:0, done:false, wordState:null, checked:false },
    plural: { index:0, stars:0, done:false, checked:false, lastCorrect:null, showHint:false },
    reflect: { capText:"", pluralText:"" }
  };

  try {
    var saved = sessionStorage.getItem("wordWorkshopState");
    if (saved) {
      var parsed = JSON.parse(saved);
      if (parsed.cap) {
        S.cap.stars = parsed.cap.stars||0;
        S.cap.done = !!parsed.cap.done;
        S.cap.index = Math.min(parsed.cap.index||0, capQuestions.length-1);
      }
      if (parsed.plural) {
        S.plural.stars = parsed.plural.stars||0;
        S.plural.done = !!parsed.plural.done;
        S.plural.index = Math.min(parsed.plural.index||0, pluralQuestions.length-1);
      }
      if (parsed.reflect) { S.reflect.capText = parsed.reflect.capText||""; S.reflect.pluralText = parsed.reflect.pluralText||""; }
    }
  } catch(e) { /* storage unavailable, continue without it */ }

  function persist(){
    try {
      sessionStorage.setItem("wordWorkshopState", JSON.stringify({
        cap: { stars:S.cap.stars, done:S.cap.done, index:S.cap.index },
        plural: { stars:S.plural.stars, done:S.plural.done, index:S.plural.index },
        reflect: S.reflect
      }));
    } catch(e) { /* ignore */ }
  }

  /* ============ HELPERS ============ */

  function esc(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function capitalize(w){
    return w.charAt(0).toUpperCase() + w.slice(1);
  }

  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function renderDots(total, currentIdx, filledCount){
    var out = "";
    for (var i = 0; i < total; i++){
      var cls = "progress-dot";
      if (i < filledCount) cls += " filled";
      else if (i === currentIdx) cls += " current";
      out += '<span class="' + cls + '" aria-hidden="true"></span>';
    }
    return out;
  }

  /* ============ SCREEN: HOME ============ */

  function statusLabel(section){
    if (section.done) return '<span class="status done">Done</span>';
    if (section.index > 0) return '<span class="status doing">In progress</span>';
    return '<span class="status">Not started</span>';
  }

  function renderHome(){
    var screen = document.getElementById("screen");
    screen.innerHTML =
      '<div class="home-intro">' +
        '<h1>Let\'s practice two writing rules</h1>' +
        '<p>Pick a task below. Practice the rule, check your work, then write down the rule in your own words so you remember it next time.</p>' +
      '</div>' +
      '<div class="task-list">' +
        '<div class="task-card">' +
          statusLabel(S.cap) +
          '<h2>Capital letters</h2>' +
          '<p>Click the words in each sentence that need a capital letter.</p>' +
          '<button class="btn btn-primary" id="go-cap" type="button">' + (S.cap.index>0 && !S.cap.done ? "Continue" : "Start") + '</button>' +
        '</div>' +
        '<div class="task-card">' +
          statusLabel(S.plural) +
          '<h2>Making words plural</h2>' +
          '<p>Type the plural form of each word.</p>' +
          '<button class="btn btn-primary" id="go-plural" type="button">' + (S.plural.index>0 && !S.plural.done ? "Continue" : "Start") + '</button>' +
        '</div>' +
        '<div class="task-card">' +
          '<span class="status">Optional any time</span>' +
          '<h2>Write my own rules</h2>' +
          '<p>Put both rules into your own words so future-you remembers them.</p>' +
          '<button class="btn btn-ghost" id="go-reflect" type="button">Open</button>' +
        '</div>' +
      '</div>' +
      '<div class="reset-line">' +
        '<button class="link-btn" id="reset-progress" type="button">Reset all progress</button>' +
      '</div>';

    document.getElementById("go-cap").addEventListener("click", function(){
      if (S.cap.done) { S.cap.index = 0; S.cap.done = false; S.cap.stars = 0; }
      goTo("cap-practice");
    });
    document.getElementById("go-plural").addEventListener("click", function(){
      if (S.plural.done) { S.plural.index = 0; S.plural.done = false; S.plural.stars = 0; }
      goTo("plural-practice");
    });
    document.getElementById("go-reflect").addEventListener("click", function(){ goTo("reflect"); });
    document.getElementById("reset-progress").addEventListener("click", function(){
      if (!confirm("Reset all of your progress and written rules?")) return;
      S.cap = { index:0, stars:0, done:false, wordState:null, checked:false };
      S.plural = { index:0, stars:0, done:false, checked:false, lastCorrect:null, showHint:false };
      S.reflect = { capText:"", pluralText:"" };
      persist();
      goTo("home");
    });
  }

  /* ============ SCREEN: CAP PRACTICE ============ */

  function renderCapPractice(){
    var screen = document.getElementById("screen");
    var q = capQuestions[S.cap.index];
    S.cap.wordState = q.words.map(function(){ return false; });
    S.cap.checked = false;

    var chunkStart = Math.floor(S.cap.index / CAP_CHUNK) * CAP_CHUNK;

    screen.innerHTML =
      '<div class="practice-top">' +
        '<button class="btn-ghost btn" style="padding:8px 16px" id="back-home">&larr; Home</button>' +
        '<div class="progress-track">' + renderDots(capQuestions.length, S.cap.index, S.cap.index) + '</div>' +
        '<span class="q-count">Sentence ' + (S.cap.index+1) + ' of ' + capQuestions.length + '</span>' +
      '</div>' +
      '<div class="card">' +
        '<div class="instruction">Click every word that needs a capital letter.</div>' +
        '<div class="word-row" id="word-row"></div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-primary" id="check-cap" type="button">Check my answer</button>' +
          '<button class="btn btn-ghost" id="reveal-cap" type="button">Show me</button>' +
        '</div>' +
        '<div id="cap-feedback"></div>' +
      '</div>';

    var row = document.getElementById("word-row");
    q.words.forEach(function(w, idx){
      var btn = document.createElement("button");
      btn.className = "word-token";
      btn.type = "button";
      btn.setAttribute("aria-pressed", "false");
      btn.setAttribute("data-idx", idx);
      btn.textContent = w.base + w.suf;
      btn.addEventListener("click", function(){
        S.cap.wordState[idx] = !S.cap.wordState[idx];
        btn.textContent = (S.cap.wordState[idx] ? capitalize(w.base) : w.base) + w.suf;
        btn.classList.toggle("is-capped", S.cap.wordState[idx]);
        btn.setAttribute("aria-pressed", S.cap.wordState[idx] ? "true" : "false");
        btn.classList.remove("mark-correct", "mark-wrong");
      });
      row.appendChild(btn);
    });

    document.getElementById("back-home").addEventListener("click", function(){ goTo("home"); });
    document.getElementById("check-cap").addEventListener("click", function(){ checkCap(q); });
    document.getElementById("reveal-cap").addEventListener("click", function(){ revealCap(q); });
  }

  function markCapButtons(q, showResult){
    var buttons = document.querySelectorAll("#word-row .word-token");
    buttons.forEach(function(btn, idx){
      btn.classList.remove("mark-correct", "mark-wrong");
      if (showResult){
        var right = S.cap.wordState[idx] === q.words[idx].cap;
        btn.classList.add(right ? "mark-correct" : "mark-wrong");
      }
    });
  }

  function checkCap(q){
    var total = q.words.length;
    var correct = 0;
    q.words.forEach(function(w, idx){
      if (S.cap.wordState[idx] === w.cap) correct++;
    });
    markCapButtons(q, true);

    var firstCheck = !S.cap.checked;
    S.cap.checked = true;
    var allRight = correct === total;

    if (firstCheck && allRight){ S.cap.stars++; persist(); }

    var box = document.getElementById("cap-feedback");
    box.innerHTML =
      '<div class="feedback-box ' + (allRight ? "good" : "retry") + '">' +
        '<strong>' + (allRight ? "All " + total + " correct — nice work!" : correct + " of " + total + " correct so far. Try adjusting the highlighted words.") + '</strong>' +
        '<div class="rule-line">Rule: ' + esc(q.rule) + '</div>' +
      '</div>' +
      '<div class="btn-row">' +
        (allRight ? '<button class="btn btn-primary" id="next-cap" type="button">' + (isLastCap() ? "Finish" : "Next sentence") + '</button>' : '') +
      '</div>';

    if (allRight){
      document.getElementById("next-cap").addEventListener("click", nextCap);
    }
  }

  function revealCap(q){
    q.words.forEach(function(w, idx){ S.cap.wordState[idx] = w.cap; });
    document.querySelectorAll("#word-row .word-token").forEach(function(btn, idx){
      var w = q.words[idx];
      btn.textContent = (w.cap ? capitalize(w.base) : w.base) + w.suf;
      btn.classList.toggle("is-capped", w.cap);
      btn.setAttribute("aria-pressed", w.cap ? "true" : "false");
    });
    markCapButtons(q, true);
    S.cap.checked = true;

    var box = document.getElementById("cap-feedback");
    box.innerHTML =
      '<div class="feedback-box retry">' +
        '<strong>Here\'s the answer.</strong>' +
        '<div class="rule-line">Rule: ' + esc(q.rule) + '</div>' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="next-cap" type="button">' + (isLastCap() ? "Finish" : "Next sentence") + '</button>' +
      '</div>';
    document.getElementById("next-cap").addEventListener("click", nextCap);
  }

  function isLastCap(){ return S.cap.index === capQuestions.length - 1; }

  function nextCap(){
    if (isLastCap()){
      S.cap.done = true;
      persist();
      goTo("cap-done");
      return;
    }
    S.cap.index++;
    persist();
    if (S.cap.index % CAP_CHUNK === 0){
      goTo("cap-break");
    } else {
      goTo("cap-practice");
    }
  }

  function renderCapBreak(){
    var screen = document.getElementById("screen");
    screen.innerHTML =
      '<div class="card break-card">' +
        '<div class="big-glyph" aria-hidden="true">✔ ✔ ✔ ✔</div>' +
        '<h2>Nice work — take a short break.</h2>' +
        '<p>Stand up, stretch, or take a sip of water. Come back when you\'re ready for the next four sentences.</p>' +
        '<button class="btn btn-primary" id="continue-cap" type="button">I\'m ready — continue</button>' +
      '</div>';
    document.getElementById("continue-cap").addEventListener("click", function(){ goTo("cap-practice"); });
  }

  function renderCapDone(){
    var screen = document.getElementById("screen");
    screen.innerHTML =
      '<div class="card done-card">' +
        '<h1>Capital letters — complete!</h1>' +
        '<div class="done-stars">' + "\u2605".repeat(Math.max(S.cap.stars,0)) + ' ' + S.cap.stars + ' / ' + capQuestions.length + ' first-try stars</div>' +
        '<p>Now try making words plural, or write down the capital letter rule in your own words.</p>' +
        '<div class="btn-row" style="justify-content:center">' +
          '<button class="btn btn-primary" id="to-plural" type="button">Practice plurals</button>' +
          '<button class="btn btn-ghost" id="to-reflect" type="button">Write my rules</button>' +
          '<button class="btn btn-ghost" id="to-home" type="button">Home</button>' +
        '</div>' +
      '</div>';
    document.getElementById("to-plural").addEventListener("click", function(){ goTo("plural-practice"); });
    document.getElementById("to-reflect").addEventListener("click", function(){ goTo("reflect"); });
    document.getElementById("to-home").addEventListener("click", function(){ goTo("home"); });
  }

  /* ============ SCREEN: PLURAL PRACTICE ============ */

  function renderPluralPractice(){
    var screen = document.getElementById("screen");
    var q = pluralQuestions[S.plural.index];
    S.plural.checked = false;
    S.plural.lastCorrect = null;
    S.plural.showHint = false;

    screen.innerHTML =
      '<div class="practice-top">' +
        '<button class="btn-ghost btn" style="padding:8px 16px" id="back-home">&larr; Home</button>' +
        '<div class="progress-track">' + renderDots(pluralQuestions.length, S.plural.index, S.plural.index) + '</div>' +
        '<span class="q-count">Word ' + (S.plural.index+1) + ' of ' + pluralQuestions.length + '</span>' +
      '</div>' +
      '<div class="card">' +
        '<div class="instruction">Type the plural form of this word.</div>' +
        '<div class="plural-word">' + esc(q.word) + '</div>' +
        '<div class="plural-form">' +
          '<input class="text-input" type="text" id="plural-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the plural here" />' +
          '<button class="btn btn-primary" id="check-plural" type="button">Check</button>' +
        '</div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-ghost" id="hint-plural" type="button">Hint</button>' +
          '<button class="btn btn-ghost" id="reveal-plural" type="button">Show me</button>' +
        '</div>' +
        '<div id="plural-hint" class="hint-line"></div>' +
        '<div id="plural-feedback"></div>' +
      '</div>';

    var input = document.getElementById("plural-input");
    input.focus();
    input.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); checkPlural(q); }
    });
    document.getElementById("back-home").addEventListener("click", function(){ goTo("home"); });
    document.getElementById("check-plural").addEventListener("click", function(){ checkPlural(q); });
    document.getElementById("hint-plural").addEventListener("click", function(){
      document.getElementById("plural-hint").textContent = "Hint: " + q.hint;
    });
    document.getElementById("reveal-plural").addEventListener("click", function(){ revealPlural(q); });
  }

  function checkPlural(q){
    var input = document.getElementById("plural-input");
    var value = input.value.trim().toLowerCase();
    var correct = value === q.answer.toLowerCase();

    input.classList.remove("mark-correct", "mark-wrong");
    input.classList.add(correct ? "mark-correct" : "mark-wrong");

    var firstCheck = !S.plural.checked;
    S.plural.checked = true;
    if (firstCheck && correct){ S.plural.stars++; persist(); }

    var box = document.getElementById("plural-feedback");
    box.innerHTML =
      '<div class="feedback-box ' + (correct ? "good" : "retry") + '">' +
        '<strong>' + (correct ? "Correct!" : "The correct spelling is \"" + esc(q.answer) + '.\"') + '</strong>' +
        '<div class="rule-line">Rule: ' + esc(q.rule) + '</div>' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="next-plural" type="button">' + (isLastPlural() ? "Finish" : "Next word") + '</button>' +
      '</div>';
    document.getElementById("next-plural").addEventListener("click", nextPlural);
  }

  function revealPlural(q){
    var input = document.getElementById("plural-input");
    input.value = q.answer;
    input.classList.add("mark-correct");
    S.plural.checked = true;

    var box = document.getElementById("plural-feedback");
    box.innerHTML =
      '<div class="feedback-box retry">' +
        '<strong>Here\'s the answer: ' + esc(q.answer) + '</strong>' +
        '<div class="rule-line">Rule: ' + esc(q.rule) + '</div>' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="next-plural" type="button">' + (isLastPlural() ? "Finish" : "Next word") + '</button>' +
      '</div>';
    document.getElementById("next-plural").addEventListener("click", nextPlural);
  }

  function isLastPlural(){ return S.plural.index === pluralQuestions.length - 1; }

  function nextPlural(){
    if (isLastPlural()){
      S.plural.done = true;
      persist();
      goTo("plural-done");
      return;
    }
    S.plural.index++;
    persist();
    if (S.plural.index % PLURAL_CHUNK === 0){
      goTo("plural-break");
    } else {
      goTo("plural-practice");
    }
  }

  function renderPluralBreak(){
    var screen = document.getElementById("screen");
    screen.innerHTML =
      '<div class="card break-card">' +
        '<div class="big-glyph" aria-hidden="true">✔ ✔ ✔ ✔ ✔</div>' +
        '<h2>Halfway there — take a short break.</h2>' +
        '<p>Stand up, stretch, or take a sip of water. Come back when you\'re ready for the rest of the words.</p>' +
        '<button class="btn btn-primary" id="continue-plural" type="button">I\'m ready — continue</button>' +
      '</div>';
    document.getElementById("continue-plural").addEventListener("click", function(){ goTo("plural-practice"); });
  }

  function renderPluralDone(){
    var screen = document.getElementById("screen");
    screen.innerHTML =
      '<div class="card done-card">' +
        '<h1>Plurals — complete!</h1>' +
        '<div class="done-stars">' + "\u2605".repeat(Math.max(S.plural.stars,0)) + ' ' + S.plural.stars + ' / ' + pluralQuestions.length + ' first-try stars</div>' +
        '<p>Now try the capital letters practice, or write down the plural rules in your own words.</p>' +
        '<div class="btn-row" style="justify-content:center">' +
          '<button class="btn btn-primary" id="to-cap" type="button">Practice capital letters</button>' +
          '<button class="btn btn-ghost" id="to-reflect" type="button">Write my rules</button>' +
          '<button class="btn btn-ghost" id="to-home" type="button">Home</button>' +
        '</div>' +
      '</div>';
    document.getElementById("to-cap").addEventListener("click", function(){ goTo("cap-practice"); });
    document.getElementById("to-reflect").addEventListener("click", function(){ goTo("reflect"); });
    document.getElementById("to-home").addEventListener("click", function(){ goTo("home"); });
  }

  /* ============ SCREEN: REFLECT ============ */

  var capStarters = [
    "I use a capital letter at the start of a sentence when...",
    "I use a capital letter on a name when...",
    "One tricky example I found was..."
  ];
  var pluralStarters = [
    "I add -s when...",
    "I add -es when...",
    "I remember irregular plurals like child and mouse by..."
  ];

  function insertStarter(textarea, text){
    var current = textarea.value;
    var sep = current.length && !current.endsWith("\n") ? "\n" : "";
    textarea.value = current + sep + text + " ";
    textarea.focus();
    textarea.selectionStart = textarea.selectionEnd = textarea.value.length;
  }

  function renderReflect(){
    var screen = document.getElementById("screen");
    screen.innerHTML =
      '<div class="practice-top">' +
        '<button class="btn-ghost btn" style="padding:8px 16px" id="back-home">&larr; Home</button>' +
      '</div>' +
      '<h1>Write my own rules</h1>' +
      '<p>Use your own words. These sentence starters can help if you\'re stuck — click one to add it.</p>' +
      '<div class="reflect-block">' +
        '<h2>Capital letters</h2>' +
        '<div class="starter-row">' + capStarters.map(function(s,i){ return '<button class="starter-chip" data-target="cap" data-idx="' + i + '" type="button">' + esc(s) + '</button>'; }).join("") + '</div>' +
        '<textarea class="rule-input" id="cap-rule-text" aria-label="My capital letter rules"></textarea>' +
      '</div>' +
      '<div class="reflect-block">' +
        '<h2>Making words plural</h2>' +
        '<div class="starter-row">' + pluralStarters.map(function(s,i){ return '<button class="starter-chip" data-target="plural" data-idx="' + i + '" type="button">' + esc(s) + '</button>'; }).join("") + '</div>' +
        '<textarea class="rule-input" id="plural-rule-text" aria-label="My plural rules"></textarea>' +
      '</div>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="download-rules" type="button">Download my rules</button>' +
        '<button class="btn btn-ghost" id="copy-rules" type="button">Copy to clipboard</button>' +
        '<button class="btn btn-ghost" id="print-rules" type="button">Print</button>' +
      '</div>' +
      '<div class="save-note" id="save-note"></div>';

    var capBox = document.getElementById("cap-rule-text");
    var pluralBox = document.getElementById("plural-rule-text");
    capBox.value = S.reflect.capText;
    pluralBox.value = S.reflect.pluralText;

    function saveDraft(){
      S.reflect.capText = capBox.value;
      S.reflect.pluralText = pluralBox.value;
      persist();
    }
    capBox.addEventListener("input", saveDraft);
    pluralBox.addEventListener("input", saveDraft);

    document.getElementById("back-home").addEventListener("click", function(){ saveDraft(); goTo("home"); });

    document.querySelectorAll(".starter-chip").forEach(function(chip){
      chip.addEventListener("click", function(){
        var target = chip.getAttribute("data-target") === "cap" ? capBox : pluralBox;
        var idx = Number(chip.getAttribute("data-idx"));
        var text = (chip.getAttribute("data-target") === "cap" ? capStarters : pluralStarters)[idx];
        insertStarter(target, text);
        saveDraft();
      });
    });

    document.getElementById("download-rules").addEventListener("click", function(){
      saveDraft();
      var content = "MY CAPITAL LETTER RULES\n" + (capBox.value || "(not written yet)") +
        "\n\nMY PLURAL RULES\n" + (pluralBox.value || "(not written yet)") + "\n";
      var blob = new Blob([content], {type:"text/plain"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "my-word-rules.txt";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      document.getElementById("save-note").textContent = "Downloaded as my-word-rules.txt.";
    });

    document.getElementById("copy-rules").addEventListener("click", function(){
      saveDraft();
      var content = "MY CAPITAL LETTER RULES\n" + (capBox.value || "(not written yet)") +
        "\n\nMY PLURAL RULES\n" + (pluralBox.value || "(not written yet)");
      var note = document.getElementById("save-note");
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(content).then(function(){
          note.textContent = "Copied to clipboard.";
        }).catch(function(){
          note.textContent = "Couldn't copy automatically — please select and copy the text by hand.";
        });
      } else {
        note.textContent = "Copying isn't available on this browser — try Download instead.";
      }
    });

    document.getElementById("print-rules").addEventListener("click", function(){
      saveDraft();
      window.print();
    });
  }

  function syncPrintView(){
    var view = document.getElementById("print-view");
    view.innerHTML =
      '<h1>My Word Rules</h1>' +
      '<h2>Capital letters</h2>' +
      '<div class="printed-rule">' + esc(S.reflect.capText || "(not written yet)") + '</div>' +
      '<h2>Making words plural</h2>' +
      '<div class="printed-rule">' + esc(S.reflect.pluralText || "(not written yet)") + '</div>';
  }
  window.addEventListener("beforeprint", syncPrintView);

  /* ============ ROUTER ============ */

  var renderers = {
    "home": renderHome,
    "cap-practice": renderCapPractice,
    "cap-break": renderCapBreak,
    "cap-done": renderCapDone,
    "plural-practice": renderPluralPractice,
    "plural-break": renderPluralBreak,
    "plural-done": renderPluralDone,
    "reflect": renderReflect
  };

  function goTo(screenName){
    S.screen = screenName;
    renderers[screenName]();
    document.getElementById("screen").scrollIntoView({behavior: motionReduced() ? "auto" : "smooth", block:"start"});
    window.scrollTo(0,0);
  }

  /* ============ ACCESSIBILITY TOOLBAR ============ */

  var sizeSteps = ["normal", "large", "xlarge"];
  var sizeLabels = { normal:"Normal", large:"Large", xlarge:"Extra large" };

  function motionReduced(){
    return document.documentElement.getAttribute("data-motion") === "reduced";
  }

  document.getElementById("btn-home-icon").addEventListener("click", function(){ goTo("home"); });

  document.getElementById("btn-text-size").addEventListener("click", function(){
    var current = document.documentElement.getAttribute("data-size") || "normal";
    var idx = sizeSteps.indexOf(current);
    var next = sizeSteps[(idx + 1) % sizeSteps.length];
    document.documentElement.setAttribute("data-size", next);
    this.textContent = "Text size: " + sizeLabels[next];
  });

  document.getElementById("btn-motion").addEventListener("click", function(){
    var reduced = motionReduced();
    document.documentElement.setAttribute("data-motion", reduced ? "full" : "reduced");
    this.setAttribute("aria-pressed", reduced ? "false" : "true");
  });

  /* ============ INIT ============ */

  goTo("home");

})();
</script>
</body>
</html>
